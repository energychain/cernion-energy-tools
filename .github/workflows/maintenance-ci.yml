name: Maintenance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    # Serial coverage plus real forecast-model tests exceeded the previous 20-minute budget.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Update package-lock.json for Node 22
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for forecast models
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/forecast-portfolio/requirements.txt
            tools/forecast-product/requirements.txt
            tools/forecast-quality/requirements.txt
            tools/xlsx-forecast-test/requirements.txt

      - name: Install forecast dependencies
        run: |
          python -m venv .venv-forecast
          .venv-forecast/bin/python -m pip install -r tools/forecast-portfolio/requirements.txt -r tools/forecast-product/requirements.txt -r tools/forecast-quality/requirements.txt -r tools/xlsx-forecast-test/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests (coverage gates)
        run: npm run test:unit:ci

      - name: Forecast Python tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          for suite in forecast-product forecast-portfolio forecast-quality xlsx-forecast-test; do
            .venv-forecast/bin/python -m unittest discover -s tools/$suite -p 'test_*.py' || exit 1
          done

      - name: TDD matrix tests (v0.52.4)
        run: npm run test:tdd-matrix

      - name: TDD matrix hard coverage gate (must be 100% passed)
        run: npm run check:tdd-matrix-coverage

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-final.json
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

      - name: Integration test discovery sanity check
        run: npm run test:integration -- --listTests

      - name: OpenAPI audit report
        run: npm run audit:openapi

      - name: Detect changelog changes
        id: changelog
        uses: dorny/paths-filter@v4
        with:
          filters: |
            changelog:
              - 'CHANGELOG.md'

      - name: LLM context sync check (strict on changelog changes)
        if: steps.changelog.outputs.changelog == 'true'
        run: npm run check:llm

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Update package-lock.json for Node 22
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (advisory)
        run: npm run audit:security:advisory

  security-critical-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Update package-lock.json for Node 22
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (critical gate)
        run: npm audit --audit-level=critical
