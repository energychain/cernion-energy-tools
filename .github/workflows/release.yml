name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Update package-lock.json for Node 22
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: TDD matrix tests (v0.52.4)
        run: npm run test:tdd-matrix

      - name: TDD matrix hard coverage gate (must be 100% passed)
        run: npm run check:tdd-matrix-coverage

      - name: Release quality gate
        run: npm run release:check

      - name: Build
        run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
