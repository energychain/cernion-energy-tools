sonar.projectKey=energychain_cernion-energy-tools
sonar.organization=energychain

# This PR is a repo-wide lint/Prettier baseline slice. Keep CPD focused on
# hand-authored implementation logic instead of treating reformatted fixtures,
# tests, generated context, and registry/catalog data as new duplication.
sonar.cpd.exclusions=\
  llm.txt,\
  tests/**,\
  src/capability-catalog.js,\
  src/dossier-hydration-registry.js,\
  src/evidence-registry.js,\
  src/vdmi-blueprint-pack-seeds.js,\
  services/dashboard-api.service.js
