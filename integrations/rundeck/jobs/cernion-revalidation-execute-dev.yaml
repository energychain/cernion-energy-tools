- defaultTab: output
  description: DevServer-only Cernion controlled revalidation
  executionEnabled: true
  id: cernion-revalidation-execute-dev
  loglevel: INFO
  name: Cernion Revalidation Execute Dev
  nodeFilterEditable: false
  options:
    - name: taskId
      required: true
    - name: idempotencyKey
      required: true
  scheduleEnabled: false
  sequence:
    keepgoing: false
    strategy: node-first
    commands:
      - script: |
          set -euo pipefail
          set -a
          . /run/cernion/cernion.env
          set +a
          cd /workspace/cernion-energy-tools
          task_id="${RD_OPTION_TASKID:?taskId option is required}"
          idempotency_key="${RD_OPTION_IDEMPOTENCYKEY:?idempotencyKey option is required}"
          correlation_id="rundeck:${RD_JOB_EXECID:-manual}"
          requested_by="rundeck:${RD_JOB_USERNAME:-rundeck}"
          payload="$(printf '{"dryRun":false,"executionMode":"dev-controlled","idempotencyKey":"%s","correlationId":"%s","requestedBy":"%s"}' "$idempotency_key" "$correlation_id" "$requested_by")"
          integrations/rundeck/scripts/cernion-runbook-call.sh POST "/api/operations-runbook/revalidation/${task_id}/execute" "$payload"
