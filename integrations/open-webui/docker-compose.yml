services:
  cernion-sidecar-bridge:
    image: node:22-alpine
    working_dir: /app
    command: node integrations/open-webui/cernion-sidecar-bridge.js
    volumes:
      - ../..:/app:ro
    environment:
      CERNION_OPEN_WEBUI_BRIDGE_HOST: 0.0.0.0
      CERNION_OPEN_WEBUI_BRIDGE_PORT: 8087
      CERNION_OPEN_WEBUI_MODEL_ID: ${CERNION_OPEN_WEBUI_MODEL_ID:-cernion-dev-sidecar}
      CERNION_SIDECAR_MANIFEST_URL: ${CERNION_SIDECAR_MANIFEST_URL:?set a Sidecar manifest URL}
      CERNION_SIDECAR_ASK_URL: ${CERNION_SIDECAR_ASK_URL:?set a Sidecar ask URL}
      CERNION_SIDECAR_PLAN_URL: ${CERNION_SIDECAR_PLAN_URL:?set a Sidecar plan URL}
      CERNION_SIDECAR_EXPIRES_AT: ${CERNION_SIDECAR_EXPIRES_AT:?set the Sidecar expiry timestamp}
      CERNION_SIDECAR_TOKEN: ${CERNION_SIDECAR_TOKEN:-}
    ports:
      - "127.0.0.1:8087:8087"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8087/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    depends_on:
      cernion-sidecar-bridge:
        condition: service_started
    environment:
      OPENAI_API_BASE_URLS: http://cernion-sidecar-bridge:8087/v1
      OPENAI_API_KEYS: local-cernion-placeholder
      DEFAULT_MODELS: ${CERNION_OPEN_WEBUI_MODEL_ID:-cernion-dev-sidecar}
      WEBUI_AUTH: ${WEBUI_AUTH:-False}
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
